<html lang="en">
<head>

</head>
<body>
<div class="wrap">
  <h1><span class="dot"></span>HLS Player</h1>

  <div class="card">
    <div class="input-row">
      <div class="url-wrap">
        <input id="jsonUrl" type="url" inputmode="url" placeholder="JSON URL (plain array of mp4 URLs)" autocomplete="off">
      </div>
      <button id="loadBtn">Load</button>
    </div>
  </div>

  <div class="loading" id="loading"><span class="spinner"></span><span>Loading stream&hellip;</span></div>
  <div class="status" id="status"><span class="pill" id="statusPill">HLS</span><span id="statusText"></span></div>
  <div class="msg err" id="err"></div>

  <div class="player" id="player">
    <video id="video" controls playsinline></video>
  </div>

  <div class="link-box" id="linkBox">
    <a id="link" href="#" target="_blank" rel="noopener"></a>
  </div>

  <div class="hint" id="hint">Paste a JSON URL containing a plain array of direct mp4 URLs. The player builds a single stream from them.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const input = $('jsonUrl'), loadBtn = $('loadBtn');
  const player = $('player'), video = $('video');
  const loading = $('loading'), errBox = $('err');
  const status = $('status'), statusPill = $('statusPill'), statusText = $('statusText');
  const linkBox = $('linkBox'), link = $('link');

  let hls = null, seqMode = false, urls = [], idx = 0;

  function setStatus(pill, text, cls) {
    statusPill.textContent = pill;
    statusPill.className = 'pill' + (cls ? ' ' + cls : '');
    statusText.textContent = text;
    status.classList.add('show');
  }
  function showErr(m, cls) {
    errBox.textContent = m;
    errBox.className = 'msg ' + (cls || 'err');
  }
  function hideErr() { errBox.classList.remove('err', 'warn'); errBox.style.display = 'none'; }

  function buildM3u8Url(jsonUrl) {
    return 'hls.php?json=' + encodeURIComponent(jsonUrl) + '&probe=1';
  }

  function startSequential() {
    if (seqMode) return;
    seqMode = true;
    hideErr();
    idx = 0;
    setStatus('SEQ', urls.length + ' files, playing in sequence', 'seq');
    player.classList.add('show');
    loading.classList.remove('show');
    loadBtn.disabled = false;
    video.controls = true;
    playNext();
  }

  function playNext() {
    if (!seqMode) return;
    if (idx >= urls.length) {
      setStatus('SEQ', 'Done — all ' + urls.length + ' files played', 'seq');
      return;
    }
    setStatus('SEQ', 'Playing ' + (idx + 1) + ' / ' + urls.length, 'seq');
    video.src = urls[idx];
    idx++;
    video.play().catch(() => {});
  }

  function loadStream(jsonUrl) {
    hideErr();
    seqMode = false;
    if (hls) { try { hls.destroy(); } catch (e) {} hls = null; }
    player.classList.remove('show');
    linkBox.classList.remove('show');
    status.classList.remove('show');
    loading.classList.add('show');
    loadBtn.disabled = true;

    const m3u8 = buildM3u8Url(jsonUrl);
    link.href = m3u8;
    link.textContent = m3u8;
    linkBox.classList.add('show');

    fetchUrlList(jsonUrl);
  }

  function fetchUrlList(jsonUrl) {
    setStatus('SEQ', 'Fetching file list…', 'seq');
    fetch('hls.php?json=' + encodeURIComponent(jsonUrl) + '&list=1')
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data || !Array.isArray(data.urls) || data.urls.length === 0) {
          showErr('No valid mp4 URLs found in that JSON.');
          loading.classList.remove('show');
          loadBtn.disabled = false;
          return;
        }
        urls = data.urls;
        startSequential();
      })
      .catch(function (e) {
        showErr('Could not read the file list: ' + e.message);
        loading.classList.remove('show');
        loadBtn.disabled = false;
      });
  }

  loadBtn.addEventListener('click', () => {
    const v = input.value.trim();
    if (!v) { showErr('Paste a JSON URL first.'); return; }
    loadStream(v);
  });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadBtn.click(); });

  const initial = new URLSearchParams(location.search).get('json');
  if (initial) {
    input.value = initial;
    loadStream(initial);
  }
})();
</script>
</body>
</html>
