<div class="wrap">

        <input id="jsonUrl" type="url" inputmode="url" placeholder="JSON URL (plain array of mp4 URLs)" autocomplete="off">
      </div>
      <button id="loadBtn">Load</button>
    </div>
  </div>

  <div class="loading" id="loading"><span class="spinner"></span><span>Loading stream&hellip;</span></div>
  <div class="msg err" id="err"></div>

  <div class="player" id="player">
    <video id="video" controls playsinline></video>
  </div>

  <div class="link-box" id="linkBox">
    <a id="link" href="#" target="_blank" rel="noopener"></a>
  </div>

  <div class="hint" id="hint">Paste a JSON URL containing a plain array of direct mp4 URLs. The player builds a single HLS stream from them.</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const input = $('jsonUrl'), loadBtn = $('loadBtn');
  const player = $('player'), video = $('video');
  const loading = $('loading'), errBox = $('err'), linkBox = $('linkBox'), link = $('link');

  function showErr(m) { errBox.textContent = m; errBox.style.display = 'block'; }
  function hideErr() { errBox.style.display = 'none'; }

  function buildM3u8Url(jsonUrl) {
    return 'hls.php?json=' + encodeURIComponent(jsonUrl);
  }

  function loadStream(jsonUrl) {
    hideErr();
    player.classList.remove('show');
    linkBox.classList.remove('show');
    loading.classList.add('show');
    loadBtn.disabled = true;

    const m3u8 = buildM3u8Url(jsonUrl);
    link.href = m3u8;
    link.textContent = m3u8;
    linkBox.classList.add('show');

    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = m3u8;
      video.play().catch(() => {});
      player.classList.add('show');
      loading.classList.remove('show');
      loadBtn.disabled = false;
      return;
    }

    if (window.Hls && Hls.isSupported()) {
      const hls = new Hls({ enableWorker: true });
      hls.loadSource(m3u8);
      hls.attachMedia(video);
      hls.on(Hls.Events.ERROR, function (e, data) {
        if (data && data.fatal) {
          showErr('Stream error: ' + (data.details || 'unknown'));
          loading.classList.remove('show');
          loadBtn.disabled = false;
        }
      });
      hls.on(Hls.Events.MANIFEST_PARSED, function () {
        video.play().catch(() => {});
        player.classList.add('show');
        loading.classList.remove('show');
        loadBtn.disabled = false;
      });
      return;
    }

    showErr('HLS playback not supported in this browser.');
    loading.classList.remove('show');
    loadBtn.disabled = false;
  }

  loadBtn.addEventListener('click', () => {
    const v = input.value.trim();
    if (!v) { showErr('Paste a JSON URL first.'); return; }
    loadStream(v);
  });
  input.addEventListener('keydown', (e) => { if (e.key === 'Enter') loadBtn.click(); });

  const initial = new URLSearchParams(location.search).get('json');
  if (initial) {
    input.value = initial;
    loadStream(initial);
  }
})();
</script>
</body>
</html>
